receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
  transform/redact:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name"])
      - context: span
        statements:
          - keep_keys(attributes, ["http.request.method", "http.response.status_code"])
          - set(name, "redacted")
          - set(status.message, "")
      - context: spanevent
        statements:
          - keep_keys(attributes, [])
          - set(name, "redacted")
  batch:
    timeout: 1s
exporters:
  file:
    path: /traces/traces.json
    rotation:
      max_megabytes: 8
      max_backups: 1
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/redact, batch]
      exporters: [file]
