# Golden Reference Repository for MAVIS Studio Live (Java + .NET 8 + Postgres)
# Commit alongside mavis-runtime.yaml for deterministic preflight, OTel auto-instrumentation, and Change Impact labs.
services:
  gateway:
    build: ./gateway
    expose:
      - "8080"
    environment:
      ORDERS_URL: http://orders:8080
      CATALOG_URL: http://catalog:8080
    depends_on:
      - orders
      - catalog
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  orders:
    build: ./orders
    expose:
      - "8080"
    environment:
      PAYMENT_URL: http://payment:8080
    depends_on:
      - payment
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  payment:
    build: ./payment
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  catalog:
    build: ./catalog
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
