name: PR-Agent Auto Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-agent:
    name: PR-Agent (Gemini - Code Review Only)

    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest

    steps:
      - name: Run PR-Agent
        uses: the-pr-agent/pr-agent@main

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          config.model: "gemini/gemini-3.8-flash"
          config.fallback_models: '["gemini/gemini-3.6-flash"]'

    
          github_action_config.auto_review: "true"

          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"

          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review"]'

          
          github_action_config.handle_push_trigger: "true"
          github_action_config.push_commands: '["/review"]'
