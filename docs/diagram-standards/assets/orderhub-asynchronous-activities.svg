<svg xmlns="http://www.w3.org/2000/svg" width="1530" height="1190" viewBox="0 0 1530 1190" role="img" aria-labelledby="title desc">
  <title id="title">OrderHub: two independent activities linked by the OrderCreated signal</title>
  <desc id="desc">Activity A creates an order with Order API and Inventory Service partitions. It forks audit and sending OrderCreated, joins those local branches, returns HTTP 201 and ends. Activity B independently waits for OrderCreated, authorizes payment, records billing and ends. No control-flow edge connects the two activities.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 9 10" refX="7" refY="5" markerWidth="9" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L7 5 L1 9" fill="none" stroke="#17212b" stroke-width="1.8"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #17212b; font-size: 19px; }
      .heading { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #465568; }
      .label { font-size: 18px; font-weight: 700; }
      .small { font-size: 16px; fill: #465568; }
      .frame { fill: #fff; stroke: #17212b; stroke-width: 2; }
      .action { fill: #fff; stroke: #17212b; stroke-width: 2; rx: 14; }
      .edge { fill: none; stroke: #17212b; stroke-width: 2; marker-end: url(#arrow); }
      .rule { stroke: #17212b; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1530" height="1190" fill="#fff"/>
  <text x="24" y="35" class="heading">OrderHub — two independent activities</text>
  <text x="24" y="60" class="subtitle">Designed example · aligned lanes are a MAVIS presentation convention</text>

  <rect x="24" y="80" width="960" height="1050" class="frame"/>
  <text x="44" y="108" class="label">act Place order (Activity A)</text>
  <path d="M24 122 H984 M24 155 H984 M650 122 V1130" class="rule" fill="none"/>
  <text x="337" y="146" text-anchor="middle" class="label">Order API</text>
  <text x="817" y="146" text-anchor="middle" class="label">Inventory Service</text>

  <circle cx="350" cy="185" r="12" fill="#17212b"/>
  <path d="M350 197 V225" class="edge"/>
  <rect x="245" y="225" width="210" height="54" class="action"/>
  <text x="350" y="258" text-anchor="middle">Validate request</text>
  <path d="M350 279 V310" class="edge"/>
  <path d="M350 310 L372 332 L350 354 L328 332 Z" class="frame"/>
  <path d="M328 332 H142 V383" class="edge"/>
  <text x="188" y="319">[invalid]</text>
  <rect x="60" y="383" width="164" height="50" class="action"/>
  <text x="142" y="414" text-anchor="middle">Return 400</text>
  <path d="M142 433 V462" class="edge"/>
  <circle cx="142" cy="480" r="17" class="frame"/>
  <circle cx="142" cy="480" r="10" fill="#17212b"/>
  <path d="M372 332 H817 V383" class="edge"/>
  <text x="480" y="319">[valid]</text>
  <rect x="717" y="383" width="200" height="54" class="action"/>
  <text x="817" y="416" text-anchor="middle">Reserve stock</text>
  <path d="M817 437 V520 H372" class="edge"/>
  <path d="M350 498 L372 520 L350 542 L328 520 Z" class="frame"/>
  <path d="M328 520 H142 V562" class="edge"/>
  <text x="166" y="507">[not available]</text>
  <rect x="60" y="562" width="164" height="50" class="action"/>
  <text x="142" y="593" text-anchor="middle">Return 409</text>
  <path d="M142 612 V645" class="edge"/>
  <circle cx="142" cy="663" r="17" class="frame"/>
  <circle cx="142" cy="663" r="10" fill="#17212b"/>
  <path d="M350 542 V587" class="edge"/>
  <text x="365" y="567">[available]</text>
  <rect x="245" y="587" width="210" height="54" class="action"/>
  <text x="350" y="620" text-anchor="middle">Persist order</text>
  <path d="M350 641 V690" class="edge"/>
  <rect x="180" y="690" width="360" height="10" fill="#17212b"/>
  <text x="555" y="702" class="small">Fork</text>
  <path d="M244 700 V750" class="edge"/>
  <path d="M492 700 V750" class="edge"/>
  <rect x="155" y="750" width="178" height="58" class="action"/>
  <text x="244" y="785" text-anchor="middle">Record audit</text>
  <path d="M392 750 H572 L602 779 L572 808 H392 Z" class="frame"/>
  <text x="490" y="775" text-anchor="middle" class="small">Send signal</text>
  <text x="490" y="798" text-anchor="middle">OrderCreated</text>
  <path d="M244 808 V865" class="edge"/>
  <path d="M492 808 V865" class="edge"/>
  <rect x="180" y="865" width="360" height="10" fill="#17212b"/>
  <text x="555" y="877" class="small">Join</text>
  <path d="M350 875 V925" class="edge"/>
  <rect x="245" y="925" width="210" height="54" class="action"/>
  <text x="350" y="958" text-anchor="middle">Return 201 Created</text>
  <path d="M350 979 V1020" class="edge"/>
  <circle cx="350" cy="1038" r="17" class="frame"/>
  <circle cx="350" cy="1038" r="10" fill="#17212b"/>
  <text x="44" y="1096" class="small">Activity Final ends A only; successful send does not mean billing is complete.</text>

  <rect x="1034" y="80" width="472" height="1050" class="frame"/>
  <text x="1054" y="108" class="label">act Handle OrderCreated (Activity B)</text>
  <path d="M1034 122 H1506 M1034 155 H1506" class="rule" fill="none"/>
  <text x="1270" y="146" text-anchor="middle" class="label">Billing Worker</text>
  <circle cx="1270" cy="185" r="12" fill="#17212b"/>
  <path d="M1270 197 V267" class="edge"/>
  <text x="1290" y="240" class="small">Wait for signal</text>
  <path d="M1120 267 H1420 V335 H1120 L1144 301 Z" class="frame"/>
  <text x="1270" y="295" text-anchor="middle" class="small">Accept event</text>
  <text x="1270" y="320" text-anchor="middle">OrderCreated</text>
  <path d="M1270 335 V425" class="edge"/>
  <rect x="1140" y="425" width="260" height="58" class="action"/>
  <text x="1270" y="460" text-anchor="middle">Authorize payment</text>
  <path d="M1270 483 V570" class="edge"/>
  <rect x="1140" y="570" width="260" height="58" class="action"/>
  <text x="1270" y="605" text-anchor="middle">Record billing status</text>
  <path d="M1270 628 V720" class="edge"/>
  <circle cx="1270" cy="738" r="17" class="frame"/>
  <circle cx="1270" cy="738" r="10" fill="#17212b"/>
  <text x="1054" y="840" class="small">A and B have separate execution lifetimes.</text>
  <text x="1054" y="868" class="small">Sending and accepting refer to the same signal;</text>
  <text x="1054" y="896" class="small">there is no ControlFlow edge between frames.</text>
  <text x="1054" y="946" class="small">Billing may run before or after HTTP 201.</text>
  <text x="1054" y="974" class="small">Ending A does not cancel independent Activity B.</text>
  <text x="1054" y="1096" class="small">Success path shown; retry and failure are omitted.</text>
  <text x="24" y="1166" class="subtitle">Partition boundaries express responsibility; they do not create independent activities or identify a network protocol.</text>
</svg>
