# Activate with SPRING_PROFILES_ACTIVE=cloud. Supply secrets outside Git.
spring:
  datasource:
    url: ${MAVIS_DB_URL}
    username: ${MAVIS_DB_USERNAME}
    password: ${MAVIS_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${MAVIS_DB_MAX_POOL_SIZE:4}
      minimum-idle: 1
      connection-timeout: 15000
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: ${MAVIS_DB_MIGRATIONS_ENABLED:false}
    clean-disabled: true
server:
  jwt:
    secret: ${MAVIS_JWT_SECRET}
mavis:
  security:
    dev-bypass-enabled: false
  runner:
    service-key: ${MAVIS_RUNNER_SERVICE_KEY}
    allow-unverified-poc-promotion: false
