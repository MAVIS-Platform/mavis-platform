spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB
  application:
    name: mavis-backend

  datasource:
    # URL kết nối tới Cloud PostgreSQL (Aiven)
    url: ${MAVIS_DB_URL:jdbc:postgresql://localhost:5432/mavis}
    username: ${MAVIS_DB_USERNAME:mavis}
    password: ${MAVIS_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        reWriteBatchedInserts: true

  jpa:
    # Disable OSIV so long-lived SSE streams (/studio/stream) never pin HikariCP DB connections.
    open-in-view: false
    # Khng cho php JPA t? ??ng t?o b?ng v chng ta s? dng Flyway
    hibernate:
      ddl-auto: validate
    show-sql: ${MAVIS_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${MAVIS_SHOW_SQL:false}
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    # Session-level advisory locks allow CREATE INDEX CONCURRENTLY migrations.
    postgresql:
      transactional-lock: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}
            required: ${MAIL_STARTTLS_ENABLE:true}

server:
  port: 8080

  jwt:
    secret: "3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a756788e25d2b7c7b8d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c"
    expiration: ${MAVIS_JWT_EXPIRATION_MS:3600000}

app:
  google:
    client-id: "${APP_GOOGLE_CLIENT_ID:417379784748-uceg8s5qlhsj7tjmld8k7pju5p2b8nm5.apps.googleusercontent.com}"
  github:
    client-id: "${APP_GITHUB_CLIENT_ID:}"
    client-secret: "${APP_GITHUB_CLIENT_SECRET:}"

mavis:
  security:
    dev-bypass-enabled: false
  runtime:
    environment-key: ${MAVIS_RUNTIME_ENVIRONMENT_KEY:}
  runner:
    state-root: ${MAVIS_RUNNER_STATE_ROOT:${java.io.tmpdir}/mavis-runner-state}
    auto-dispatch-enabled: ${MAVIS_RUNNER_AUTO_DISPATCH:true}
    mode: ${MAVIS_RUNNER_MODE:AUTO}
    service-key: ${MAVIS_RUNNER_SERVICE_KEY:}
    collector-image: ${MAVIS_RUNNER_COLLECTOR_IMAGE:otel/opentelemetry-collector-contrib@sha256:1175b03003053962012f5a231f5567f66a3e8fdb960c7835c0e48f7aa1555806}
    scenario-runner-image: ${MAVIS_RUNNER_SCENARIO_RUNNER_IMAGE:mcr.microsoft.com/dotnet/aspnet@sha256:d5633778c754e89a386882eddf8dbee6942447a8a4b8267c19cf1e1158d0b0ac}
    collector-config-path: ${MAVIS_RUNNER_COLLECTOR_CONFIG:samples/runtime-poc/collector.yaml}
    runner-project-path: ${MAVIS_RUNNER_PROJECT_PATH:../MAVIS.Worker/src/MAVIS.Runner/MAVIS.Runner.csproj}
    allow-unverified-poc-promotion: false
