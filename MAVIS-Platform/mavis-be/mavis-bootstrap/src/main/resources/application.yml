spring:
  application:
    name: mavis-backend

  datasource:
    # URL k?t n?i t?i con database mavis_db b?n v?a t?o
    url: jdbc:postgresql://localhost:5432/mavis_db
    # ?i?n username c?a PostgreSQL trn my b?n (th??ng l postgres)
    username: postgres
    # ?i?n m?t kh?u PostgreSQL trn my b?n vo ?y
    password: 12345
    driver-class-name: org.postgresql.Driver

  jpa:
    # Khng cho php JPA t? ??ng t?o b?ng v chng ta s? dng Flyway
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:mavisproject247@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

