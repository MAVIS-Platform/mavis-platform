spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB
  application:
    name: mavis-backend

  datasource:
    # URL kết nối tới Cloud PostgreSQL (Aiven)
    url: ${MAVIS_DB_URL:jdbc:postgresql://localhost:5432/mavis}
    username: ${MAVIS_DB_USERNAME:mavis}
    password: ${MAVIS_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    # Khng cho php JPA t? ??ng t?o b?ng v chng ta s? dng Flyway
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:mavisproject247@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

  jwt:
    secret: "3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a756788e25d2b7c7b8d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c"
    expiration: 86400000

app:
  google:
    client-id: "417379784748-uceg8s5qlhsj7tjmld8k7pju5p2b8nm5.apps.googleusercontent.com"

mavis:
  security:
    dev-bypass-enabled: true
  runner:
    service-key: ${MAVIS_RUNNER_SERVICE_KEY:mavis-runner-secret-key-test}
    allow-unverified-poc-promotion: true