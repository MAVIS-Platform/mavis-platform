spring:
  config:
    import:
      - optional:file:../../../.env.backend.local[.properties]
      - optional:file:../../.env.backend.local[.properties]
      - optional:file:../.env.backend.local[.properties]
      - optional:file:.env.backend.local[.properties]
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB
  application:
    name: mavis-backend

  datasource:
    # URL kết nối tới Cloud PostgreSQL (Aiven)
    url: ${MAVIS_DB_URL:${mavis.db.url:${mavis_db_url:jdbc:postgresql://localhost:5432/mavis}}}
    username: ${MAVIS_DB_USERNAME:${mavis.db.username:${mavis_db_username:mavis}}}
    password: ${MAVIS_DB_PASSWORD:${mavis.db.password:${mavis_db_password:}}}
    driver-class-name: org.postgresql.Driver

  jpa:
    # Khng cho php JPA t? ??ng t?o b?ng v chng ta s? dng Flyway
    hibernate:
      ddl-auto: validate
    show-sql: ${MAVIS_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${MAVIS_SHOW_SQL:false}
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: ${MAVIS_DB_MIGRATIONS_ENABLED:false}
    baseline-on-migrate: true
    # Session-level advisory locks allow CREATE INDEX CONCURRENTLY migrations.
    postgresql:
      transactional-lock: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}
            required: ${MAIL_STARTTLS_ENABLE:true}

server:
  port: ${SERVER_PORT:${server_port:8081}}

  jwt:
    secret: "3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a756788e25d2b7c7b8d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c"
    expiration: 86400000

app:
  google:
    client-id: "417379784748-uceg8s5qlhsj7tjmld8k7pju5p2b8nm5.apps.googleusercontent.com"

mavis:
  security:
    dev-bypass-enabled: true
  runner:
    state-root: ${MAVIS_RUNNER_STATE_ROOT:${java.io.tmpdir}/mavis-runner-state}
    auto-dispatch-enabled: ${MAVIS_RUNNER_AUTO_DISPATCH:true}
    mode: ${MAVIS_RUNNER_MODE:AUTO}
    service-key: ${MAVIS_RUNNER_SERVICE_KEY:mavis-local-runner-secret-key}
    collector-config-path: ${MAVIS_RUNNER_COLLECTOR_CONFIG:samples/runtime-poc/collector.yaml}
    runner-project-path: ${MAVIS_RUNNER_PROJECT_PATH:../MAVIS.Worker/src/MAVIS.Runner/MAVIS.Runner.csproj}
    allow-unverified-poc-promotion: true