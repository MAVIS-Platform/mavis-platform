spring:
  application:
    name: mavis-backend

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:your_dummy_api_key_here}
      chat:
        options:
          model: gpt-3.5-turbo

  datasource:
    # URL k?t n?i t?i con database mavis_db b?n v?a t?o
    url: jdbc:postgresql://localhost:5432/mavis_db
    # ?i?n username c?a PostgreSQL tr�n m�y b?n (th??ng l� postgres)
    username: postgres
    # ?i?n m?t kh?u PostgreSQL tr�n m�y b?n v�o ?�y
    password: 12345
    driver-class-name: org.postgresql.Driver

  jpa:
    # Kh�ng cho ph�p JPA t? ??ng t?o b?ng v� ch�ng ta s? d�ng Flyway
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080