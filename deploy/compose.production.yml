name: mavis

services:
  backend:
    image: ${IMAGE_PREFIX:-mavis}-backend:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: MAVIS-Platform/mavis-be/Dockerfile
    restart: unless-stopped
    env_file: ${MAVIS_ENV_FILE:-../.env.backend.local}
    environment:
      SPRING_PROFILES_ACTIVE: cloud
      SERVER_PORT: "8080"
      JAVA_TOOL_OPTIONS: ${MAVIS_JAVA_TOOL_OPTIONS:--XX:+UseG1GC -XX:MaxRAMPercentage=60.0 -XX:+ExitOnOutOfMemoryError -XX:MaxGCPauseMillis=200}
      MAVIS_DB_URL: ${MAVIS_DB_URL:?Set MAVIS_DB_URL in deploy/.env}
      MAVIS_DB_USERNAME: ${MAVIS_DB_USERNAME:?Set MAVIS_DB_USERNAME in deploy/.env}
      MAVIS_DB_PASSWORD: ${MAVIS_DB_PASSWORD:?Set MAVIS_DB_PASSWORD in deploy/.env}
      MAVIS_JWT_SECRET: ${MAVIS_JWT_SECRET:?Generate MAVIS_JWT_SECRET}
      MAVIS_AI_API_KEY: ${MAVIS_AI_API_KEY:-}
      MAVIS_AI_USAGE_INGEST_KEY: ${MAVIS_AI_USAGE_INGEST_KEY:-}
      MAVIS_NOTIFICATIONS_REMINDERS_ENABLED: ${MAVIS_NOTIFICATIONS_REMINDERS_ENABLED:-false}
      MAVIS_NOTIFICATIONS_MONITORING_ENABLED: ${MAVIS_NOTIFICATIONS_MONITORING_ENABLED:-false}
      OPENAI_ADMIN_KEY: ${OPENAI_ADMIN_KEY:-}
      OPENAI_PROJECT_ID: ${OPENAI_PROJECT_ID:-}
      MAVIS_GCP_PROJECT_ID: ${MAVIS_GCP_PROJECT_ID:-}
      MAVIS_GEMINI_QUOTA_TIER: ${MAVIS_GEMINI_QUOTA_TIER:-}
      MAVIS_GCP_MONITORING_TOKEN_FILE: ${MAVIS_GCP_MONITORING_TOKEN_FILE:-}
      MAVIS_RUNNER_SERVICE_KEY: ${MAVIS_RUNNER_SERVICE_KEY:?Generate MAVIS_RUNNER_SERVICE_KEY}
      MAVIS_WORKER_SERVICE_KEY: ${MAVIS_WORKER_SERVICE_KEY:?Generate MAVIS_WORKER_SERVICE_KEY}
      MAVIS_WORKER_GRANT_KEY: ${MAVIS_WORKER_GRANT_KEY:?Generate MAVIS_WORKER_GRANT_KEY}
      MAVIS_WORKER_ENABLED: "true"
      MAVIS_WORKER_DOTNET_URL: http://worker:8080
      MAVIS_WORKER_GRANT_KEY_ID: production
      MAVIS_STORAGE_UPLOAD_DIR: /data/uploads
      MAVIS_WORKER_SNAPSHOT_ROOT: /data/uploads
      MAVIS_WORKER_ARTIFACT_ROOT: /data/worker-artifacts
      MAVIS_RUNNER_AUTO_DISPATCH_ENABLED: "true"
      MAVIS_RUNNER_MODE: ${MAVIS_RUNNER_MODE:-AUTO}
      MAVIS_RUNNER_OCI_RUNTIME: ${MAVIS_RUNNER_OCI_RUNTIME:-auto}
      MAVIS_RUNNER_GVISOR_WRITABLE_ROOTFS: ${MAVIS_RUNNER_GVISOR_WRITABLE_ROOTFS:-true}
      MAVIS_RUNTIME_MAX_ACTIVE_STUDIO_SESSIONS: ${MAVIS_RUNTIME_MAX_ACTIVE_STUDIO_SESSIONS:-2}
      MAVIS_RUNTIME_MAX_QUEUED_STUDIO_SESSIONS: ${MAVIS_RUNTIME_MAX_QUEUED_STUDIO_SESSIONS:-30}
      MAVIS_RUNTIME_STUDIO_ABANDONED_SECONDS: ${MAVIS_RUNTIME_STUDIO_ABANDONED_SECONDS:-180}
      MAVIS_RUNTIME_STUDIO_MAX_SESSION_SECONDS: ${MAVIS_RUNTIME_STUDIO_MAX_SESSION_SECONDS:-3600}
      MAVIS_RUNTIME_LOW_DISK_THRESHOLD_MIB: ${MAVIS_RUNTIME_LOW_DISK_THRESHOLD_MIB:-2048}
      MAVIS_RUNNER_SANDBOX_REGISTRY: ${MAVIS_RUNNER_SANDBOX_REGISTRY:-}
      MAVIS_RUNNER_STATE_ROOT: /tmp/mavis-runner-state
      MAVIS_RUNNER_PROJECT_PATH: /app/runner/MAVIS.Runner.dll
      MAVIS_RUNNER_COLLECTOR_CONFIG: /app/samples/runtime-poc/collector.yaml
      MAVIS_RUNTIME_ENVIRONMENT_KEY: ${MAVIS_RUNTIME_ENVIRONMENT_KEY:-}
      # Digest-pinned images the sandbox runner pulls (e.g. otel/opentelemetry-collector-contrib@sha256:...).
      MAVIS_RUNNER_COLLECTOR_IMAGE: ${MAVIS_RUNNER_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib@sha256:1175b03003053962012f5a231f5567f66a3e8fdb960c7835c0e48f7aa1555806}
      MAVIS_RUNNER_SCENARIO_RUNNER_IMAGE: ${MAVIS_RUNNER_SCENARIO_RUNNER_IMAGE:-mcr.microsoft.com/dotnet/aspnet@sha256:d5633778c754e89a386882eddf8dbee6942447a8a4b8267c19cf1e1158d0b0ac}
      MAVIS_RUNNER_ALLOW_UNVERIFIED_POC_PROMOTION: "false"
      APP_GOOGLE_CLIENT_ID: ${MAVIS_GOOGLE_CLIENT_ID:-}
      APP_GITHUB_CLIENT_ID: ${MAVIS_GITHUB_CLIENT_ID:-}
      APP_GITHUB_CLIENT_SECRET: ${MAVIS_GITHUB_CLIENT_SECRET:-}
      MAVIS_RUNNER_DOCKER_SOCKET_MOUNTED: "true"
    group_add:
      - "${DOCKER_GID:-999}"
      - "0"
    volumes:
      - data:/data
      - /tmp/mavis-runner-state:/tmp/mavis-runner-state
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      worker:
        condition: service_started
    expose:
      - "8080"
    ports:
      # Loopback-only so local Nginx can proxy /api/v1/analyzer/runtime/ to the allowlisted Runner VM IP without exposing backend publicly.
      - "127.0.0.1:${MAVIS_BE_PORT:-8081}:8080"

  worker:
    image: ${IMAGE_PREFIX:-mavis}-worker:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: MAVIS.Worker/Dockerfile.production
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      WorkerAccess__ApiKey: ${MAVIS_WORKER_SERVICE_KEY:?Generate MAVIS_WORKER_SERVICE_KEY}
      ArtifactScope__Root: /data/worker-artifacts
      ArtifactScope__GrantKeys__production: ${MAVIS_WORKER_GRANT_KEY:?Generate MAVIS_WORKER_GRANT_KEY}
    volumes:
      - data:/data
    expose:
      - "8080"

  frontend:
    image: ${IMAGE_PREFIX:-mavis}-frontend:${IMAGE_TAG:-local}
    build:
      context: ../MAVIS-Frontend
      args:
        NEXT_PUBLIC_DRAWIO_URL: ${NEXT_PUBLIC_DRAWIO_URL:-https://maviss.site/drawio}
    restart: unless-stopped
    environment:
      MAVIS_API_MODE: backend
      MAVIS_JAVA_URL: http://backend:8080
      MAVIS_AI_USAGE_INGEST_KEY: ${MAVIS_AI_USAGE_INGEST_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      MAVIS_AI_API_KEY: ${MAVIS_AI_API_KEY:-}
      MAVIS_GOOGLE_CLIENT_ID: ${MAVIS_GOOGLE_CLIENT_ID:-}
      MAVIS_GITHUB_CLIENT_ID: ${MAVIS_GITHUB_CLIENT_ID:-}
      MAVIS_PUBLIC_URL: ${MAVIS_PUBLIC_URL:-}
    ports:
      - "${MAVIS_BIND_ADDRESS:-127.0.0.1}:${MAVIS_FE_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/auth-config').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  data:
